<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Scraper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0b;
      --surface: #141416;
      --surface-hover: #1c1c1f;
      --border: #27272a;
      --border-focus: #3f3f46;
      --border-input: #71717a;
      --text: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #16a34a;
      --success-bg: #052e16;
      --error: #dc2626;
      --error-bg: #450a0a;
      --radius: 8px;
    }

    body {
      color-scheme: dark;
      width: 380px;
      min-height: 200px;
      max-height: 600px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      overflow-y: auto;
    }

    body.standalone {
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      max-height: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Scrollable content area above the pinned footer — only the fields
       scroll; the header and button row stay put. */
    body.standalone .scroll-area {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    body.standalone .button-row {
      flex-shrink: 0;
      margin-top: 0;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      padding: 5px 6px !important;
      position: relative;
    }

    .icon-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border-focus);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-2px);
      transition: opacity 0.15s ease-out, transform 0.15s ease-out;
      pointer-events: none;
      z-index: 10;
    }

    .icon-btn:hover::after,
    .icon-btn:focus-visible::after {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .header-icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-icon svg {
      width: 12px;
      height: 12px;
      fill: white;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .settings-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .settings-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--border-focus);
    }

    /* States */
    .state {
      display: none;
      padding: 16px;
    }

    .state.active {
      display: block;
    }

    /* Loading state */
    .loading-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      gap: 12px;
    }

    .loading-state.active {
      display: flex;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-state p {
      color: var(--text-secondary);
      font-size: 13px;
    }

    /* Form */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group:last-of-type {
      margin-bottom: 0;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-row .form-group {
      margin-bottom: 0;
    }

    .form-group-nested {
      margin-top: 10px;
      margin-left: 14px;
      padding-left: 10px;
      border-left: 2px solid var(--border);
    }

    .form-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .form-label label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-label .char-count {
      font-size: 10px;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      background: #27272a;
      border: 1px solid var(--border-input);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
    }

    input[type="text"]::placeholder,
    textarea::placeholder {
      color: var(--text-muted);
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    textarea.description-field {
      min-height: 80px;
      max-height: 140px;
      font-size: 12px;
    }

    body.standalone textarea.description-field {
      max-height: none;
      min-height: 93px;
    }

    .url-field {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Buttons */
    .button-row {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
      position: sticky;
      bottom: 0;
      background: var(--bg);
    }

    .button-row::before {
      content: '';
      position: absolute;
      top: -24px;
      left: 0;
      right: 0;
      height: 24px;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.1));
      pointer-events: none;
    }

    .button-row-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 9px 16px;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #3f3f46;
      color: var(--text);
      border: 1px solid var(--border-input);
    }

    .btn-secondary:hover {
      background: #52525b;
      color: var(--text);
    }

    .btn-apps {
      background: #16a34a;
      color: white;
    }

    .btn-apps:hover {
      background: #15803d;
    }

    .btn-apps:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @keyframes btnPop {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @keyframes drawCheck {
      from { stroke-dashoffset: 24; }
      to   { stroke-dashoffset: 0; }
    }

    .btn-saved {
      animation: btnPop 0.35s ease-out;
    }

    .btn-saved polyline {
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
      animation: drawCheck 0.3s ease-out 0.05s forwards;
    }

    /* Status banner */
    .status-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      margin: 0;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.25s ease-out, opacity 0.2s ease-out, padding 0.25s ease-out, margin 0.25s ease-out;
    }

    .status-banner.active {
      max-height: 60px;
      opacity: 1;
      padding: 10px 14px;
      margin: 10px 0 0;
    }

    .status-banner.success {
      background: var(--success-bg);
      color: #4ade80;
      border: 1px solid #14532d;
    }

    .status-banner.error {
      background: var(--error-bg);
      color: #f87171;
      border: 1px solid #7f1d1d;
    }

    .status-banner svg {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
    }

    .status-banner .status-text {
      flex: 1;
      line-height: 1.4;
    }

    /* No config state */
    .no-config {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px;
      gap: 12px;
      text-align: center;
    }

    .no-config.active {
      display: flex;
    }

    .no-config-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .no-config-icon svg {
      width: 20px;
      height: 20px;
      color: var(--text-muted);
    }

    .no-config h2 {
      font-size: 14px;
      font-weight: 600;
    }

    .no-config p {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .no-config .btn {
      margin-top: 4px;
      flex: none;
      padding: 8px 20px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 6H16V4C16 2.89 15.11 2 14 2H10C8.89 2 8 2.89 8 4V6H4C2.89 6 2 6.89 2 8V19C2 20.11 2.89 21 4 21H20C21.11 21 22 20.11 22 19V8C22 6.89 21.11 6 20 6ZM10 4H14V6H10V4Z"/></svg>
      </div>
      <h1>Job Scraper</h1>
    </div>
    <div class="header-actions">
      <button class="settings-btn icon-btn" id="openWindow" data-tooltip="Open in separate window" aria-label="Open in separate window">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </button>
      <button class="settings-btn icon-btn" id="openSettings" data-tooltip="Settings" aria-label="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 0 1 0 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 0 1 0-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/><path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
      </button>
    </div>
  </div>

  <div class="scroll-area">
  <!-- No config state -->
  <div class="no-config" id="noConfigState">
    <div class="no-config-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </div>
    <h2>Setup Required</h2>
    <p>Add your Airtable credentials in Settings to start saving job postings.</p>
    <button class="btn btn-primary" id="openSettingsFromConfig">Open Settings</button>
  </div>

  <!-- Loading state -->
  <div class="loading-state" id="loadingState">
    <div class="spinner"></div>
    <p>Scanning job posting...</p>
  </div>

  <!-- Form state -->
  <div class="state" id="formState">
    <div class="form-group">
      <div class="form-label">
        <label for="jobTitle">Job Title</label>
      </div>
      <input type="text" id="jobTitle" placeholder="e.g. Senior UX Designer" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <div class="form-label">
          <label for="company">Company</label>
        </div>
        <input type="text" id="company" placeholder="e.g. Omnidian" />
      </div>

      <div class="form-group">
        <div class="form-label">
          <label for="location">Location</label>
        </div>
        <input type="text" id="location" placeholder="e.g. Seattle, Hybrid" />
      </div>
    </div>

    <div class="form-group">
      <div class="form-label">
        <label for="salary">Salary Range</label>
      </div>
      <input type="text" id="salary" placeholder="e.g. $110,500 - $149,500 a year" />
    </div>

    <div class="form-group">
      <div class="form-label">
        <label for="description">Job Description</label>
        <span class="char-count" id="descCharCount"></span>
      </div>
      <textarea id="description" class="description-field" placeholder="Full job description..."></textarea>
    </div>

    <div class="form-group">
      <div class="form-label">
        <label for="status">Status</label>
      </div>
      <select id="status">
        <option value="Interested">Interested</option>
        <option value="Applied">Applied</option>
      </select>

      <div class="form-group form-group-nested" id="dateAppliedGroup" hidden>
        <div class="form-label">
          <label for="dateApplied">Date Applied</label>
          <span class="char-count">Optional</span>
        </div>
        <input type="date" id="dateApplied" />
      </div>
    </div>

    <div class="form-group">
      <div class="form-label">
        <label for="url">URL</label>
      </div>
      <input type="text" id="url" class="url-field" readonly />
    </div>
  </div>
  </div>

  <!-- Action buttons + status -->
  <div class="button-row" id="buttonRow" style="display: none;">
    <div class="button-row-actions">
      <button class="btn btn-secondary" id="rescanBtn" style="flex: none; padding: 9px 12px;">Rescan</button>
      <button class="btn btn-apps" id="appsBtn">Save to applications</button>
    </div>
    <div class="status-banner" id="statusBanner">
      <svg id="statusIcon" viewBox="0 0 24 24" fill="currentColor"></svg>
      <span class="status-text" id="statusText"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
